name: Publish GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven package version
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Maven packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up NDK r24
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r24

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cargo nodejs npm cmake ninja-build

      - name: Install C++ grammar dependencies
        working-directory: grammars/cpp
        run: npm install

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Publish selected packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew \
            :annotations:publishReleasePublicationToGitHubPackagesRepository \
            :android-tree-sitter:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-cpp:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-groovy:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-java:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-json:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-kotlin:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-log:publishReleasePublicationToGitHubPackagesRepository \
            :tree-sitter-xml:publishReleasePublicationToGitHubPackagesRepository \
            -PreleaseVersion=${{ inputs.version }} \
            --no-daemon \
            --parallel \
            --stacktrace
